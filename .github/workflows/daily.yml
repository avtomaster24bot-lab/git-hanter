name: Ежедневная подборка

on:
  schedule:
    - cron: "0 3 * * *"   # 08:00 по Алматы
  workflow_dispatch:
    inputs:
      force:
        description: "Пересобрать подборку за сегодня"
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore: ["data/**", "audio/**", "feed.xml"]

permissions:
  contents: write
  models: read
  pages: write
  id-token: write

concurrency:
  group: git-hanter
  cancel-in-progress: false

jobs:
  digest:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Собрать подборку
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: python scripts/generate.py
      - name: Сохранить в репозиторий
        run: |
          git config user.name "git-hanter-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data audio feed.xml
          if git diff --cached --quiet; then echo "Нет изменений"; else
            git commit -m "Подборка за $(TZ=Asia/Almaty date +%F)"
            git pull --rebase origin main && git push
          fi
      - name: Отправить в Telegram
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        run: python scripts/telegram.py

  deploy:
    needs: digest
    if: always() && (needs.digest.result == 'success' || needs.digest.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Собрать сайт
        run: |
          mkdir _site
          cp -r index.html app.js style.css assets data audio feed.xml .nojekyll _site/ 2>/dev/null || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
