<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Git Hunter — код авторизации TikTok</title>
<link rel="stylesheet" href="style.css"></head><body><main class="wrap" style="padding-top:60px;max-width:720px">
<h1>Код авторизации TikTok</h1><div id="out" class="empty"></div>
<p class="sub">Скопируйте code и обменяйте его на токены командой из <a href="https://github.com/avtomaster24bot-lab/git-hunter/blob/main/docs/AUTOPUBLISH.md#3-tiktok">инструкции</a>. Код действует несколько минут. Никому его не показывайте.</p>
</main><script>
const q=new URLSearchParams(location.search),c=q.get("code"),e=q.get("error");
document.getElementById("out").innerHTML=c?`<p><b>code:</b></p><textarea style="width:100%;height:90px;background:#111827;color:#e6ebf3;border:1px solid #222c3d;border-radius:10px;padding:10px" readonly>${c.replace(/</g,"&lt;")}</textarea><p><button class="btn" onclick="navigator.clipboard.writeText(document.querySelector('textarea').value)">Скопировать</button></p>`:(e?`Ошибка: ${e.replace(/</g,"&lt;")} — ${(q.get("error_description")||"").replace(/</g,"&lt;")}`:"Здесь появится code после входа в TikTok.");
</script></body></html>
